<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eaf5fd">
<title>Shade - Find cool air in San Diego County</title>
<meta name="description" content="Call Shade to find the nearest open cooling center in San Diego County during extreme heat and wildfire smoke.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@200;300;400;500;600&family=Red+Hat+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="liquid" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="n"/>
  <feGaussianBlur in="n" stdDeviation="2" result="s"/>
  <feDisplacementMap in="SourceGraphic" in2="s" scale="60" xChannelSelector="R" yChannelSelector="G"/>
</filter></svg>
<div id="root"></div>
<script type="module" src="/src/home/main.tsx"></script>
</body>
</html>
